global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: serviceagent
    environment: production

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: serviceagent-app
    static_configs:
      - targets: ["serviceagent:8000"]
        labels:
          service: serviceagent
    scrape_interval: 10s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/serviceagent_metrics_token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
